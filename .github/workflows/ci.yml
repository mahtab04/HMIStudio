name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Newest Qt on Linux.
          - name: Linux GCC, Qt 6.12
            os: ubuntu-24.04
            qt-version: '6.12.*'
            qt-arch: linux_gcc_64
          # Minimum supported Qt (6.8 LTS) on Windows. aqtinstall 3.3.0 cannot
          # yet read Qt 6.12's new per-compiler Windows repository layout
          # (miurahr/aqtinstall "Qt 6.12 compatibility"); move this to 6.12
          # once a release supports it.
          - name: Windows MSVC, Qt 6.8
            os: windows-2022
            qt-version: '6.8.*'
            qt-arch: win64_msvc2022_64

    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt-version }}
          arch: ${{ matrix.qt-arch }}
          cache: true

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset dev

      - name: Build
        run: cmake --build --preset dev

      - name: Test
        run: ctest --preset dev
